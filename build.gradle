plugins {
    id 'java'
    id 'idea'
}

idea {
    module {
        inheritOutputDirs = false
        outputDir = file('./webapp/WEB-INF/classes')
    }
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    springVersion = "5.1.8.RELEASE"
    tomcatVersion = '8.5.42'
}

dependencies {
    // --- Test ---
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly   'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    testImplementation "org.springframework:spring-test:$springVersion"

    // --- Spring ---
    implementation "org.springframework:spring-jdbc:$springVersion"
    implementation "org.springframework:spring-web:$springVersion"

    implementation "org.reflections:reflections:0.10.2"

    // --- DB / JDBC ---
    implementation "org.apache.commons:commons-dbcp2:2.6.0"
    runtimeOnly    "com.h2database:h2:2.1.214"
    runtimeOnly    "mysql:mysql-connector-java:8.0.28"

    // --- Embedded Tomcat (Servlet 4.x: javax) ---
    implementation "org.apache.tomcat.embed:tomcat-embed-core:$tomcatVersion"   // e.g. 9.0.83
    implementation "org.apache.tomcat.embed:tomcat-embed-jasper:$tomcatVersion" // JSP 사용 시
    // implementation "org.apache.tomcat.embed:tomcat-embed-el:$tomcatVersion"   // (선택) EL 필요시

    // --- Servlet / JSP API ---
    compileOnly 'javax.servlet:javax.servlet-api:4.0.1' // @WebServlet 등 컴파일 전용
    implementation group: 'javax.servlet', name: 'jstl', version: '1.2'

    // --- JSON ---
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.7.1'
}

test {
    useJUnitPlatform()
}